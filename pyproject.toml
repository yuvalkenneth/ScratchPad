[project]
name = "scratchpad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.30.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
training = [
    "accelerate>=1.0.0",
    "datasets>=4.0.0",
    "peft>=0.19.0",
    "torch>=2.4.0",
    "transformers>=4.57.0,<6.0.0",
    "trl>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
